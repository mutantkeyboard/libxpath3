# CI for libxpath3.
#
# All jobs use the public Fedora image, so no project-specific image is needed.
# glibc-langpack-de provides a locale with a decimal comma, so testvalue checks
# that number formatting ignores the locale.
# Windows jobs (MSVC, MinGW) are added once it is clear whether this project
# can use GNOME's Windows runners (tag "win32-ps").

stages:
  - build
  - docs

default:
  image: fedora:latest
  before_script:
    - >
      dnf install -y --setopt=install_weak_deps=False
      gcc clang compiler-rt libasan libubsan
      meson ninja-build cmake pkgconf-pkg-config
      libxml2-devel doxygen git glibc-langpack-de

variables:
  UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

.meson:
  stage: build
  script:
    - meson setup build --werror $MESON_ARGS
    - meson compile -C build
    - meson test -C build --print-errorlogs
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - build/meson-logs/

# Default configuration: C99, warning level 3, warnings as errors.
gcc:
  extends: .meson
  variables:
    CC: gcc

# Strict C99: no extensions, no VLAs.
gcc:c99:
  extends: .meson
  variables:
    CC: gcc
    MESON_ARGS: "-Dc_std=c99"
    CFLAGS: "-pedantic-errors -Werror=vla"

# The mechanical parts of the coding style, which no formatter can
# reproduce: see .gitlab-ci/check-style.py.
style:
  stage: build
  before_script:
    - dnf install -y --setopt=install_weak_deps=False python3 git
  script:
    - python3 .gitlab-ci/check-style.py

clang:asan:
  extends: .meson
  variables:
    CC: clang
    MESON_ARGS: "-Db_sanitize=address,undefined -Db_lundef=false"
    ASAN_OPTIONS: "detect_leaks=1"

# All tests under ThreadSanitizer, for testthreads: several threads
# evaluating one compiled expression with shared constants.
clang:tsan:
  extends: .meson
  variables:
    CC: clang
    MESON_ARGS: "-Db_sanitize=thread -Db_lundef=false"
    TSAN_OPTIONS: "halt_on_error=1"

cmake:
  stage: build
  script:
    - cmake -S . -B build-cmake -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
    - cmake --build build-cmake
    - ctest --test-dir build-cmake --output-on-failure

# Build and test against libxml2 master, to catch upstream changes early.
libxml2:master:
  stage: build
  variables:
    CC: gcc
    LIBXML2_PREFIX: "$CI_PROJECT_DIR/libxml2-install"
  script:
    - git clone --depth 1 https://gitlab.gnome.org/GNOME/libxml2.git libxml2-src
    - meson setup libxml2-build libxml2-src --prefix="$LIBXML2_PREFIX" --libdir=lib -Dpython=disabled -Ddocs=disabled
    - meson install -C libxml2-build
    - export PKG_CONFIG_PATH="$LIBXML2_PREFIX/lib/pkgconfig"
    - export LD_LIBRARY_PATH="$LIBXML2_PREFIX/lib"
    - meson setup build --werror
    - meson compile -C build
    - meson test -C build --print-errorlogs
    - ./build/test/testbasic

# Compile-only QT3 conformance, against a pinned commit of the test suite.
# The job log ends with the pass rate of each level. Known failures are
# listed in qt3/known-failures-*.txt; any other failure, or a known failure
# that now passes, fails the job. It then evaluates the tests as a report:
# while evaluation is incomplete, its failures don't fail the job, but a
# crash does, and so does a test whose outcome changes when compiled
# without optimizing (-c). It runs under ASan and UBSan, so every QT3
# expression is also a memory-safety test.
qt3:
  stage: build
  variables:
    CC: clang
    ASAN_OPTIONS: "detect_leaks=1"
    QT3_COMMIT: 201a6e466940cdfc727f4babfedcde5332b9f578
  script:
    - git init -q qt3tests
    - git -C qt3tests fetch -q --depth 1 https://github.com/w3c/qt3tests.git "$QT3_COMMIT"
    - git -C qt3tests checkout -q FETCH_HEAD
    - meson setup build --werror -Db_sanitize=address,undefined -Db_lundef=false
    - meson compile -C build
    - >
      for spec in XP20 XP30 XP31; do
      ./build/qt3/qt3run -s $spec -k qt3/known-failures-$spec.txt qt3tests/catalog.xml || exit 1;
      done
    - >
      for spec in XP20 XP30 XP31; do
      ./build/qt3/qt3run -e -c -s $spec qt3tests/catalog.xml > qt3-eval.txt || exit 1;
      tail -n 1 qt3-eval.txt;
      done

# Line coverage of the library sources, from the unit tests, the replayed
# fuzz corpus and the QT3 run. GitLab shows the percentage on pipelines and
# MRs, and marks covered and uncovered lines in MR diffs. The HTML report is
# kept as an artifact. Only this job sets a coverage value, because GitLab
# averages the values of all jobs.
coverage:
  stage: build
  variables:
    CC: gcc
    QT3_COMMIT: 201a6e466940cdfc727f4babfedcde5332b9f578
  script:
    - dnf install -y --setopt=install_weak_deps=False gcovr
    - git init -q qt3tests
    - git -C qt3tests fetch -q --depth 1 https://github.com/w3c/qt3tests.git "$QT3_COMMIT"
    - git -C qt3tests checkout -q FETCH_HEAD
    # Atomic counters: testthreads runs threads, which otherwise corrupt
    # them (https://gcc.gnu.org/bugzilla/show_bug.cgi?id=68080)
    - meson setup build -Db_coverage=true -Dc_args=-fprofile-update=atomic
    - meson compile -C build
    - meson test -C build --print-errorlogs
    - >
      for spec in XP20 XP30 XP31; do
      ./build/qt3/qt3run -s $spec -k qt3/known-failures-$spec.txt qt3tests/catalog.xml || exit 1;
      done
    - >
      for spec in XP20 XP30 XP31; do
      ./build/qt3/qt3run -e -c -s $spec qt3tests/catalog.xml > qt3-eval.txt || exit 1;
      tail -n 1 qt3-eval.txt;
      done
    - mkdir coverage
    - >
      gcovr --root . --filter '[^/]*\.c$' --exclude-unreachable-branches
      --print-summary --cobertura coverage.xml
      --html-details coverage/index.html build
  coverage: '/^lines: (\d+\.\d+)%/'
  artifacts:
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Fuzzing smoke test: two minutes of libFuzzer on compiling (xp3parse)
# and two on evaluation (xp3eval, which also checks that optimizing
# never changes a result), with ASan and UBSan, seeded with the corpora
# and the dictionary. This catches regressions that the replayed corpora
# miss; longer runs are fuzz:long below, and overnight runs happen
# outside CI (.gitlab-ci/fuzz-long.sh).
fuzz:
  stage: build
  variables:
    CC: clang
    ASAN_OPTIONS: "detect_leaks=1"
  script:
    - meson setup build --werror -Dfuzzer=true -Db_sanitize=address,undefined -Db_lundef=false
    - meson compile -C build
    - mkdir corpus corpus-eval && cp fuzz/seed/* corpus/ && cp fuzz/seed-eval/* corpus-eval/
    - ./build/fuzz/xp3parse-fuzz -dict=fuzz/xp3.dict -max_len=10000 -max_total_time=120 -print_final_stats=1 corpus
    - ./build/fuzz/xp3eval-fuzz -dict=fuzz/xp3.dict -max_len=10000 -max_total_time=120 -print_final_stats=1 corpus-eval
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - crash-*
      - leak-*
      - timeout-*
      - oom-*

# Long fuzzing on demand: started by hand, it runs both fuzzers for 50
# minutes each in a child pipeline (.gitlab-ci/fuzz-long.yml). The job
# succeeds once the child pipeline is created, so this pipeline never
# waits for the fuzzers; their results are in the child pipeline.
fuzz:long:
  stage: build
  needs: []
  when: manual
  trigger:
    include: .gitlab-ci/fuzz-long.yml

docs:
  stage: docs
  needs: []
  variables:
    DOXYGEN_WARN_AS_ERROR: "FAIL_ON_WARNINGS"
  script:
    - meson setup build -Ddocs=enabled
    - meson compile -C build
  artifacts:
    expire_in: 1 week
    paths:
      - build/doc/html/
